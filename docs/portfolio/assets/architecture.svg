<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Wild Oasis AI Hospitality Platform architecture</title>
  <desc id="desc">Guest and staff browsers connect to a Next.js BFF. Typed AI tools call a model and Supabase. Staff mutations require approval.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f3}.card{fill:#fff;stroke:#1f2937;stroke-width:2}.trust{fill:#eef6f1;stroke:#166534;stroke-width:2;stroke-dasharray:8 6}.title{font:700 28px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:14px system-ui,sans-serif;fill:#374151}.small{font:12px system-ui,sans-serif;fill:#4b5563}.line{stroke:#374151;stroke-width:2;fill:none;marker-end:url(#arrow)}.approval{stroke:#b45309;stroke-width:3;fill:none;marker-end:url(#arrowGold)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720" rx="24"/>
  <text class="title" x="60" y="60">Wild Oasis AI Hospitality Platform</text>
  <text class="body" x="60" y="90">AI interprets and orchestrates; typed tools, RLS, trusted code, and humans control facts and writes.</text>

  <rect class="card" x="60" y="150" width="250" height="130" rx="16"/>
  <text class="head" x="85" y="185">Guest Experience</text>
  <text class="body" x="85" y="215">Streaming concierge</text><text class="body" x="85" y="238">Policy Q&amp;A · recommendations</text><text class="body" x="85" y="261">Adopt plan → editable prefill</text>

  <rect class="card" x="60" y="410" width="250" height="160" rx="16"/>
  <text class="head" x="85" y="445">Staff Operations</text>
  <text class="body" x="85" y="475">Risk Briefing + correction</text><text class="body" x="85" y="498">KPI · charts · booking cards</text><text class="body" x="85" y="521">Draft → approve / reject</text><text class="small" x="85" y="548">Supabase JWT + exact-origin CORS</text>

  <rect class="trust" x="400" y="125" width="420" height="485" rx="22"/>
  <text class="head" x="430" y="162">Trusted server boundary — Next.js BFF</text>
  <rect class="card" x="445" y="195" width="330" height="105" rx="14"/>
  <text class="head" x="470" y="228">Auth + validation</text><text class="body" x="470" y="255">Rebuild untrusted chat · app_metadata role</text><text class="body" x="470" y="278">bounds · timeout · rate limit · CORS</text>
  <rect class="card" x="445" y="330" width="330" height="105" rx="14"/>
  <text class="head" x="470" y="363">Typed, bounded tools</text><text class="body" x="470" y="390">inventory · policy · KPI · risk</text><text class="body" x="470" y="413">prices and constraints are deterministic</text>
  <rect class="card" x="445" y="465" width="330" height="105" rx="14"/>
  <text class="head" x="470" y="498">Observability + approval</text><text class="body" x="470" y="525">safe trace fields · signed feedback</text><text class="body" x="470" y="548">allow-listed, idempotent note mutation</text>

  <rect class="card" x="910" y="180" width="230" height="125" rx="16"/>
  <text class="head" x="935" y="215">Model provider</text><text class="body" x="935" y="245">Redacted, bounded context</text><text class="body" x="935" y="268">No database credentials</text>
  <rect class="card" x="910" y="405" width="230" height="150" rx="16"/>
  <text class="head" x="935" y="440">Supabase</text><text class="body" x="935" y="470">Explicit grants + RLS</text><text class="body" x="935" y="493">Live inventory / business data</text><text class="body" x="935" y="516">ai_runs / feedback / audit</text><text class="small" x="935" y="540">Shared isolated demo project</text>

  <path class="line" d="M310 215 H400"/><path class="line" d="M310 480 H400"/>
  <path class="line" d="M775 247 H910"/><path class="line" d="M775 382 C850 382 850 455 910 455"/>
  <path class="line" d="M910 520 H810"/>
  <path class="approval" d="M310 535 C360 650 845 650 910 535"/>
  <text class="small" x="490" y="683">Human approval is required before the sole write-capable internal-note action.</text>
</svg>
